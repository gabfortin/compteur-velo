name: Mise à jour quotidienne

on:
  schedule:
    # 08:15 heure de Montréal en hiver (EST = UTC-5) → 13:15 UTC.
    # En été (EDT = UTC-4), GitHub Actions ne suit pas le fuseau horaire
    # local : ce déclencheur s'exécutera alors à 09:15 heure de Montréal.
    - cron: '15 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install --no-cache-dir tqdm

      - name: Télécharger les données (cyclistes.csv, bixi.csv, compteurs.csv)
        run: |
          chmod +x fetch_data.sh
          ./fetch_data.sh

      - name: Historique BIXI (années passées manquantes dans bixi_cache.json)
        run: python3 bixi_stats.py

      # Avant la génération, pour que data/site.json affiche le nouveau numéro
      - name: Incrémenter la version (patch)
        run: |
          if [ -f version.txt ]; then
            CURRENT_VERSION=$(tr -d '[:space:]' < version.txt)
            IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "$CURRENT_VERSION"
            echo "$V_MAJOR.$V_MINOR.$((V_PATCH + 1))" > version.txt
            echo "Version incrémentée : $CURRENT_VERSION → $(cat version.txt)"
          fi

      # La page (index.html, assets/) est statique : seul data/site.json est régénéré
      - name: Générer les données (data/site.json)
        run: python3 genMap.py

      - name: Valider les données
        run: |
          python3 -m unittest test_site_format
          python3 test_data.py

      # Chaque valeur publiée recalculée depuis les fichiers sources, et comparée
      # aux totaux officiels de la Ville (jour, mois, année)
      - name: Auditer les données contre les sources
        run: python3 test_sources.py

      - name: Installer le navigateur de test
        run: |
          pip install --no-cache-dir playwright
          python3 -m playwright install --with-deps chromium

      # Ne publie pas des données que la page n'arriverait pas à afficher
      - name: Tester la page avec les nouvelles données
        run: |
          python3 test_site.py
          python3 test_site_values.py

      - name: Publier sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/site.json
          [ -f velo_meta_cache.json ] && git add velo_meta_cache.json
          [ -f bixi_cache.json ] && git add bixi_cache.json
          # Historique enrichi chaque jour (l'année en cours y reste après le 1er janvier)
          git add hist_cache.json
          [ -f version.txt ] && git add version.txt

          if git diff --staged --quiet; then
            echo "Aucun changement — rien à publier."
            exit 0
          fi

          git commit -m "Mise à jour automatique — $(date '+%Y-%m-%d')"
          git push
